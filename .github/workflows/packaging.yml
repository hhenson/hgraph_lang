name: Packaging dry run
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m unittest discover -s tools
      - run: python tools/shared_artifacts.py --check
      - run: python tools/source_archive.py
      - run: python -m pip install conan
      - run: conan export .
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build the standalone distribution
        run: docker build -f packaging/docker/Dockerfile -t hgraph-lang:local .
      - name: Exercise installed compiler and SDK
        run: |
          docker run --rm -v "$PWD/packaging/smoke:/work:ro" hgraph-lang:local hgl test smoke.hgl
          docker run --rm -v "$PWD/packaging/smoke:/work:ro" hgraph-lang:local sh -ec '
            cmake -S /work/consumer -B /tmp/consumer -G Ninja
            cmake --build /tmp/consumer
            ctest --test-dir /tmp/consumer --output-on-failure
          '
