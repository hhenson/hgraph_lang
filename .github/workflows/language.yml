name: Language toolchain

# Build the standalone compiler against a separately installed, pinned SDK.
# Linux and macOS exercise compiler suites and installed downstream consumers.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Bound each sccache client; compiler workers remain independently parallel.
  TOKIO_WORKER_THREADS: "2"
  GCC_VERSION: "14"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  language:
    name: Language / ${{ matrix.os }}
    # Linux and macOS routing can be enabled independently; see build_system.rst.
    runs-on: >-
      ${{ matrix.os == 'ubuntu-24.04' && vars.HGRAPH_SELF_HOSTED == 'true'
          && !github.event.pull_request.head.repo.fork
          && fromJSON('["self-hosted","linux","x64","hg-language"]')
          || matrix.os == 'macos-26' && vars.HGRAPH_SELF_HOSTED_MACOS == 'true'
          && !github.event.pull_request.head.repo.fork
          && fromJSON('["self-hosted","macOS","ARM64","hg-language"]')
          || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            parallel: "4"
          - os: macos-26
            parallel: "3"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure the persistent build environment
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == macOS ]]; then
            workers="${HGRAPH_BUILD_PARALLELISM:-$(sysctl -n hw.logicalcpu)}"
          else
            workers="${HGRAPH_BUILD_PARALLELISM:-$(nproc)}"
          fi
          [[ "$workers" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid build parallelism" >&2; exit 1; }
          echo "HGRAPH_BUILD_PARALLELISM=$workers" >> "$GITHUB_ENV"
          tests="${HGRAPH_TEST_PARALLELISM:-6}"
          [[ "$tests" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid test parallelism" >&2; exit 1; }
          echo "HGRAPH_TEST_PARALLELISM=$tests" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$workers" >> "$GITHUB_ENV"
      - name: Enable shared compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: ${{ runner.environment == 'self-hosted' && 'v0.16.0' || 'v0.15.0' }}
      - name: Start compiler cache before parallel compilation
        if: runner.environment == 'self-hosted'
        run: |
          sccache --stop-server || true
          sccache --start-server
      # setup-python hard-codes a hosted account's tool-cache path on macOS.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os != 'macOS' || runner.environment != 'self-hosted'
        with:
          python-version: "3.12"
      - name: Create a job-local Python environment on the macOS runner
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          python3.12 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          python3.12 -m venv "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
          echo "pythonLocation=$RUNNER_TEMP/python" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/python" >> "$GITHUB_ENV"
      # The installed static hgraph SDK deliberately resolves its public C++
      # dependencies from the consuming environment. Give the installed HGL
      # consumer the same real package environment on both platforms rather
      # than letting a developer machine's package-manager state hide a missing
      # dependency prefix.
      - name: Initialize pinned shared sources
        run: python tools/shared_artifacts.py
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          # A persistent runner must not reuse a previous job's installer paths.
          micromamba-binary-path: ${{ runner.temp }}/micromamba-bin/micromamba
          micromamba-root-path: ${{ runner.temp }}/micromamba-root
          post-cleanup: all
          environment-name: hgraph-language
          cache-environment: true
          create-args: >-
            libarrow=25
            libarrow-compute=25
            libarrow-acero=25
            fmt
            spdlog>=1.15
            simdjson>=4.5
      - name: Expose SDK dependencies
        shell: micromamba-shell {0}
        run: echo "HGL_DEPENDENCY_PREFIX=$CONDA_PREFIX" >> "$GITHUB_ENV"
      - name: Configure current Clang on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "CC=/usr/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=26.0" >> "$GITHUB_ENV"
          /usr/bin/clang++ --version
      - name: Configure GCC 14 on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cc_path="$(command -v "gcc-$GCC_VERSION")"
          cxx_path="$(command -v "g++-$GCC_VERSION")"
          test "$("$cxx_path" -dumpfullversion -dumpversion | cut -d. -f1)" -eq "$GCC_VERSION"
          echo "CC=$cc_path" >> "$GITHUB_ENV"
          echo "CXX=$cxx_path" >> "$GITHUB_ENV"
          "$cxx_path" --version
      - name: Install native build dependencies
        run: >-
          python -m pip install --upgrade --only-binary=:all:
          "cmake==4.4.2" "ninja==1.13.0" "pyarrow==25.0.0"
      - name: Install clang-format from a Python wheel
        if: runner.os == 'Linux' || runner.environment == 'self-hosted'
        run: >-
          python -m pip install --upgrade --only-binary=:all:
          "clang-format==23.1.0"
      - name: Install clang-format on hosted macOS
        if: runner.os == 'macOS' && runner.environment != 'self-hosted'
        run: brew install clang-format
      - name: Expose Arrow runtime libraries
        shell: python
        run: |
          import os
          from pathlib import Path
          import pyarrow

          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(str(Path(pyarrow.__file__).resolve().parent) + "\n")
      - name: Check out the pinned SDK source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hhenson/hgraph
          ref: ffc42ebe1671d6e6ad7fb2368a9e8377b85ad479
          path: .runtime
          persist-credentials: false
      - name: Build and install the runtime SDK
        shell: bash
        run: |
          cmake -S .runtime -B build-sdk -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DHGRAPH_BUILD_SHARED=ON -DHGRAPH_BUILD_ANALYTICS_EXTENSION=ON \
            -DHGRAPH_BUILD_PYTHON_BINDINGS=OFF -DHGRAPH_ENABLE_PYTHON_USER_NODES=OFF \
            -DHGRAPH_ENABLE_IDE_PYTHON_HEADER_HINTS=OFF \
            -DHGRAPH_USE_PYARROW_ARROW=ON -DHGRAPH_FETCH_SIMDJSON=ON \
            -DHGRAPH_FETCH_DATE=ON -DHGRAPH_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_PREFIX_PATH="$HGL_DEPENDENCY_PREFIX"
          cmake --build build-sdk --parallel 3
          cmake --install build-sdk --prefix "$GITHUB_WORKSPACE/build-sdk/sdk"
      - name: Configure the standalone language toolchain
        run: >-
          cmake --preset release
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build-sdk/sdk;$HGL_DEPENDENCY_PREFIX"
          -DHGRAPH_USE_PYARROW_ARROW=ON
      - name: Build the language suites
        run: cmake --build --preset release --parallel 3
      - name: Run the language suites
        run: ctest --preset release --parallel 3
      - name: Validate language tooling
        env:
          HGRAPH_RUNTIME_SOURCE: ${{ github.workspace }}/.runtime
        run: |
          python -m pip install pytest
          python -m unittest discover -s tools
          python -m pytest tests -q
      - name: Run shared HGL conformance tests
        run: python tools/hgl_compiler_parity.py --backend cpp --build build --output build/compiler-conformance
      - name: Install and test a downstream package
        shell: bash
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/build/install"
          cmake -S packaging/smoke/consumer -B build/consumer -GNinja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/install;$GITHUB_WORKSPACE/build-sdk/sdk;$HGL_DEPENDENCY_PREFIX"
          cmake --build build/consumer --parallel 3
          ctest --test-dir build/consumer --output-on-failure
